<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>같이 듣는 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>같이 듣는 목록</h1>
    <p class="hint" id="hint">YouTube 링크를 붙여 넣으면 곡이 목록에 들어옵니다.</p>
  </header>

  <section class="panel">
    <form id="form" class="row">
      <input type="url" id="link" placeholder="YouTube 링크를 붙여 넣으세요" required>
      <input type="text" id="title" placeholder="곡 제목" required>
      <button type="submit">넣기</button>
    </form>
    <p class="error" id="error" hidden></p>
  </section>

  <main class="tracks" id="tracks"></main>

  <footer class="share">
    <button type="button" id="share">친구에게 보낼 링크 만들기</button>
    <input type="text" id="shareUrl" readonly placeholder="여기에 링크가 나옵니다">
    <p class="note">실시간이 아닙니다. 친구가 곡을 더하면 링크를 다시 받아야 보입니다.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
