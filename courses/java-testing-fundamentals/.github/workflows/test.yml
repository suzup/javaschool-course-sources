name: test

# main 브랜치로 올릴 때와, main으로 합치자고 요청할 때 실행합니다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 통합 검사가 접속할 MySQL을 이 작업 동안만 함께 띄웁니다.
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: java_quiz_test
          MYSQL_USER: quiz_app
          MYSQL_PASSWORD: quiz_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password --silent"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 내 컴퓨터에서 치던 명령과 같습니다. 실패하면 이 단계에서 멈춥니다.
      - run: ./gradlew test
        env:
          QUIZ_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/java_quiz_test
          QUIZ_TEST_DB_USERNAME: quiz_app
          QUIZ_TEST_DB_PASSWORD: quiz_password

      # 실패했을 때도 리포트를 남겨 원인을 확인할 수 있게 합니다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/reports/tests/test
