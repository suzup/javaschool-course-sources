spring.application.name=java-quiz
# 로컬의 .env 파일이 있으면 Java properties 형식으로 읽습니다.
# optional이므로 .env가 없어도 설정 탐색 자체는 실패하지 않습니다.
spring.config.import=optional:file:.env[.properties]

# .env 또는 운영 환경 변수가 있으면 그 값을 사용하고, 주소와 사용자 이름은 로컬 기본값을 허용합니다.
spring.datasource.url=${QUIZ_DB_URL:jdbc:mysql://localhost:3306/java_quiz}
spring.datasource.username=${QUIZ_DB_USERNAME:quiz_app}
spring.datasource.password=${QUIZ_DB_PASSWORD}

# Entity와 개발 DB 구조의 차이를 시작할 때 반영합니다. 운영 배포의 스키마 변경 도구를 대신하지 않습니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
server.error.include-message=never
