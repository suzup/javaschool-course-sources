# 프로젝트 루트의 .env가 있으면 테스트 실행에서도 읽습니다.
spring.config.import=optional:file:.env[.properties]

# 실행용 DB와 다른 QUIZ_TEST_DB_* 값을 사용합니다.
spring.datasource.url=${QUIZ_TEST_DB_URL:jdbc:mysql://localhost:3306/java_quiz_test}
spring.datasource.username=${QUIZ_TEST_DB_USERNAME:quiz_app}
spring.datasource.password=${QUIZ_TEST_DB_PASSWORD}

# 테스트를 시작할 때 테스트 DB의 테이블을 새로 준비합니다.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
