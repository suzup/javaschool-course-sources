spring.application.name=java-quiz
# 로컬의 .env 파일이 있으면 Java properties 형식으로 읽습니다.
# optional이므로 .env가 없어도 설정 탐색 자체는 실패하지 않습니다.
spring.config.import=optional:file:.env[.properties]

# .env 또는 운영 환경 변수가 있으면 그 값을 사용하고, 주소와 사용자 이름은 로컬 기본값을 허용합니다.
spring.datasource.url=${QUIZ_DB_URL:jdbc:mysql://localhost:3306/java_quiz}
spring.datasource.username=${QUIZ_DB_USERNAME:quiz_app}
spring.datasource.password=${QUIZ_DB_PASSWORD}

# Entity와 개발 DB 구조의 차이를 시작할 때 반영합니다. 운영 배포의 스키마 변경 도구를 대신하지 않습니다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
server.error.include-message=never

# 로그인 상태를 이어 갈 화면 주소입니다. 개발 서버와 같은 서버가 보내는 화면을 함께 적습니다.
quiz.screen-origins=${QUIZ_SCREEN_ORIGINS:http://localhost:5173,http://localhost:8081}

# 토큰 서명에 쓰는 열쇠입니다. 저장소에 올리지 않고 .env나 환경 변수로 받습니다.
quiz.token.secret=${QUIZ_TOKEN_SECRET}
# 발급한 토큰을 사용할 수 있는 시간(초)입니다.
quiz.token.valid-seconds=${QUIZ_TOKEN_VALID_SECONDS:1800}
